rust-version.workspace = true

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
hypgm-dmn-app = { path = "../../crates/domain/app" }
hypgm-dmn-hello-world = { path = "../../crates/domain/hello-world" }
