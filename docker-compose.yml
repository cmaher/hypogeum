services:
  postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_USER: foundation_admin
      POSTGRES_DB: foundation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation_admin -d foundation"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
