[package]
name = "hypgmx-file-storage"
version.workspace = true
edition = "2024"
rust-version.workspace = true

[features]
google-drive = ["dep:google-drive3", "dep:http-body-util", "dep:serde_json", "dep:hyper-rustls", "dep:moka"]

[dependencies]
moka = { version = "0.12", features = ["future"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1"], optional = true }
google-drive3 = { version = "7", optional = true }
http-body-util = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }
async-trait = "0.1"
bytes = "1"
hypgm-errors = { path = "../../core/errors", default-features = false }
futures-core = "0.3"
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["sync", "net"] }
serde_json = "1"

[lints]
workspace = true
