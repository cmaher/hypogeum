[package]
name = "hypgmx-file-storage"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
hypgm-errors = { path = "../../core/errors", default-features = false }
futures-core = "0.3"
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"

[lints]
workspace = true
