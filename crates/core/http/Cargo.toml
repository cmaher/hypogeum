[package]
name = "hypgm-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "json", "matched-path"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
serde.workspace = true
serde_json.workspace = true
hypgm-errors = { path = "../errors" }
thiserror.workspace = true
uuid.workspace = true
tracing = "0.1"
tower = "0.5"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util", "limit"] }
futures-util = "0.3"
hypgm-logging = { path = "../logging" }

[lints]
workspace = true
