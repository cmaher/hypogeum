[package]
name = "tasks"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
apalis.workspace = true
apalis-board.workspace = true
axum = "0.8"
anyhow = "1"
env-config = { path = "../env-config" }
apalis-postgres.workspace = true
errors = { path = "../errors", default-features = false }
sqlx = { workspace = true, features = ["macros"] }
tower = { version = "0.5", features = ["retry", "limit"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "=3.0.0"

[dev-dependencies]
test-support = { path = "../test-support" }
tokio = { version = "1", features = ["test-util"] }
http-body-util = "0.1"

[lints]
workspace = true
