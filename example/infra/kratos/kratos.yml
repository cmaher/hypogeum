# Ory Kratos configuration for local development behind Caddy.
# Browsers reach Kratos at http://localhost:8080/.ory/kratos/; the app reaches
# the public API directly. DSN and secrets come from Compose environment.
version: v1.3.1

serve:
  public:
    base_url: http://localhost:8080/.ory/kratos/
    cors:
      enabled: false
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:8080/
  allowed_return_urls:
    - http://localhost:8080

  methods:
    password:
      enabled: true
    profile:
      # Lets the settings flow update traits (display name).
      enabled: true
    code:
      enabled: false
      passwordless_enabled: false
    link:
      enabled: false
    totp:
      enabled: false
    lookup_secret:
      enabled: false
    webauthn:
      enabled: false
    passkey:
      enabled: false
    oidc:
      enabled: false

  flows:
    error:
      ui_url: http://localhost:8080/error

    login:
      ui_url: http://localhost:8080/login
      lifespan: 10m
      after:
        default_browser_return_url: http://localhost:8080/

    registration:
      ui_url: http://localhost:8080/registration
      lifespan: 10m
      # One form with traits and password instead of the two-step profile flow.
      enable_legacy_one_step: true
      after:
        default_browser_return_url: http://localhost:8080/registration-pending
        password:
          hooks:
            - hook: session

    settings:
      ui_url: http://localhost:8080/settings
      privileged_session_max_age: 15m
      required_aal: aal1

    logout:
      after:
        default_browser_return_url: http://localhost:8080/login

    recovery:
      enabled: false
    verification:
      enabled: false

session:
  lifespan: 24h
  whoami:
    required_aal: aal1
  cookie:
    same_site: Lax

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

log:
  level: info
  format: text
  leak_sensitive_values: false

# No mail is sent (recovery and verification are disabled and the courier is
# never started), but Kratos requires a connection URI.
courier:
  smtp:
    connection_uri: smtp://unused:unused@127.0.0.1:25/?disable_starttls=true
