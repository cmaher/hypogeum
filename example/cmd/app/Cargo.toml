[package]
name = "exemplum-app-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
exemplum-app = { path = "../../crates/app" }
exemplum-dmn-users = { path = "../../crates/domain/users" }
hypgmx-kratos = { path = "../../../crates/ext/kratos" }
hypgmx-rdbms = { path = "../../../crates/ext/rdbms" }
axum = { version = "0.8", features = ["http2"] }
tokio.workspace = true
anyhow = "1"
hypgm-envconfig = { path = "../../../crates/core/envconfig" }
hypgm-logging = { path = "../../../crates/core/logging" }
serde.workspace = true
tracing = "0.1"

[dev-dependencies]
hypgm-test-support = { path = "../../../crates/core/test-support" }
sqlx.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false }
testcontainers-modules = "0.15"
uuid.workspace = true

[lints]
workspace = true
