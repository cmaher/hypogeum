[package]
name = "exemplum-tasks-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "exemplum-tasks"
path = "src/main.rs"

[dependencies]
exemplum-dmn-users = { path = "../../crates/domain/users" }
hypgmx-tasks = { path = "../../../crates/ext/tasks" }
hypgmx-rdbms = { path = "../../../crates/ext/rdbms" }
hypgm-envconfig = { path = "../../../crates/core/envconfig" }
hypgm-logging = { path = "../../../crates/core/logging" }
anyhow = "1"
serde.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing = "0.1"

[dev-dependencies]
hypgm-test-support = { path = "../../../crates/core/test-support" }
hypgm-authn = { path = "../../../crates/core/authn" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
