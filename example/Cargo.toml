[workspace]
members = [
    "cmd/app",
    "cmd/admin",
    "cmd/db",
    "crates/app",
    "crates/domain/auth",
    "crates/domain/admin",
    "crates/domain/hello-world",
    "crates/domain/users",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "json", "uuid"] }
sea-query = { version = "=1.0.2", default-features = false, features = ["backend-postgres", "with-chrono", "with-json", "with-uuid", "thread-safe"] }
sea-query-sqlx = { version = "=0.9.1", default-features = false, features = ["sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
envy = "0.4"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Keep enough debug info for backtraces in workspace crates and none for
# dependencies. strip = "none" keeps proc-macro dylibs loadable on macOS, which
# rejects stripped ones ("mis-aligned LINKEDIT string pool").
[profile.dev]
debug = "line-tables-only"
strip = "none"

[profile.dev.package."*"]
debug = false
strip = "none"
