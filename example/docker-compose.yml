services:
  postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: exemplum
      POSTGRES_PASSWORD: ${EXEMPLUM_POSTGRES_PASSWORD:-password}
      MIGRATION_PASSWORD: ${EXEMPLUM_MIGRATION_PASSWORD:-password}
      USERS_PASSWORD: ${EXEMPLUM_USERS_PASSWORD:-password}
      TASKS_PASSWORD: ${EXEMPLUM_TASKS_PASSWORD:-password}
    ports:
      - "127.0.0.1:${EXEMPLUM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres:/provision:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d exemplum"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
