[package]
name = "exemplum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
exemplum-dmn-hello-world = { path = "../domain/hello-world" }
axum = { version = "0.8", default-features = false, features = ["tokio", "http2"] }
hypgm-http = { path = "../../../crates/core/http" }
hypgm-authn = { path = "../../../crates/core/authn" }
hypgm-errors = { path = "../../../crates/core/errors" }
sea-orm.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
tower = "0.5"

[dev-dependencies]
tokio.workspace = true
reqwest = { version = "0.12", default-features = false }
tower = { version = "0.5", features = ["util"] }
hypgm-logging = { path = "../../../crates/core/logging" }
tracing = "0.1"
futures-util = "0.3"

[lints]
workspace = true
