[package]
name = "exemplum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
exemplum-dmn-admin = { path = "../domain/admin" }
exemplum-dmn-hello-world = { path = "../domain/hello-world" }
exemplum-dmn-users = { path = "../domain/users" }
exemplum-dmn-auth = { path = "../domain/auth" }
axum = { version = "0.8", default-features = false, features = ["tokio", "http2"] }
hypgm-http = { path = "../../../crates/core/http" }
hypgm-view = { path = "../../../crates/core/view" }
hypgm-authn = { path = "../../../crates/core/authn" }
hypgm-authz = { path = "../../../crates/core/authz" }
hypgm-errors = { path = "../../../crates/core/errors" }
hypgmx-rdbms = { path = "../../../crates/ext/rdbms", features = ["postgres"] }
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tower = "0.5"
tower-sessions = "0.14"
axum-login = "0.18"

[dev-dependencies]
tokio.workspace = true
reqwest = { version = "0.12", default-features = false }
tower = { version = "0.5", features = ["util"] }
hypgm-logging = { path = "../../../crates/core/logging" }
tracing = "0.1"
futures-util = "0.3"
hypgm-test-support = { path = "../../../crates/core/test-support" }

[lints]
workspace = true
