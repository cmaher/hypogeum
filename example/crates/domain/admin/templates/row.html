<tr id="user-{{ id }}">
<td>{{ name }}</td><td>{% match username %}{% when Some with (username) %}{{ username }}{% when None %}&mdash;{% endmatch %}</td><td>{{ registered }}</td><td>{% if pending %}Pending{% else %}Approved{% endif %}</td>
<td>{% if pending %}<form method="post" action="/admin/users/{{ id }}/approve" hx-post="/admin/users/{{ id }}/approve" hx-target="#user-{{ id }}" hx-swap="outerHTML"><button type="submit">Approve</button></form>{% endif %}</td></tr>
