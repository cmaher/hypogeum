<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if register %}Register{% else %}Log in{% endif %}</title></head>
<body><main><nav><a href="/">Home</a> <a href="/register">Register</a> <a href="/login">Log in</a> <a href="/admin/users">Admin users</a></nav>
<h1>{% if register %}Register{% else %}Log in{% endif %}</h1><p>{{ message }}</p>
<form method="post" action="{% if register %}/register{% else %}/login{% endif %}">
{% if register %}<label>Display name <input name="display_name" value="{{ display_name }}" required maxlength="200" autocomplete="name"></label>{% endif %}
<label>Username <input name="username" value="{{ username }}" required maxlength="200" autocomplete="username"></label>
<label>Password <input name="password" type="password" required {% if register %}minlength="12" maxlength="128" autocomplete="new-password"{% else %}autocomplete="current-password"{% endif %}></label>
<button type="submit">{% if register %}Register{% else %}Log in{% endif %}</button></form></main></body></html>
