[config]
default_to_workspace = false

# Incremental data and debug info do not help a full CI build. strip = "none"
# keeps proc-macro dylibs loadable on macOS once debug info is off.
[env]
CARGO_INCREMENTAL = { value = "0", condition = { env_true = ["CARGO_MAKE_CI"] } }
CARGO_PROFILE_DEV_DEBUG = { value = "0", condition = { env_true = ["CARGO_MAKE_CI"] } }
CARGO_PROFILE_DEV_STRIP = { value = "none", condition = { env_true = ["CARGO_MAKE_CI"] } }

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt-fix]
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.build]
command = "cargo"
args = ["build", "--locked", "--workspace", "--all-features"]

[tasks.test]
description = "All tests; Docker must be running for self-contained integration suites"
command = "cargo"
args = ["test", "--locked", "--workspace", "--all-features"]

[tasks.test-browser]
description = "Playwright smoke checks for HTML views with JavaScript on and off; requires Node.js"
script_runner = "@shell"
script = ['cd tests/browser && npm ci && npx playwright install chromium && npm test']

[tasks.test-browser-registration]
description = "Real PostgreSQL/app registration flow in Chromium, JavaScript on and off"
script_runner = "@shell"
script = ['(cd tests/browser && npm ci && npx playwright install chromium) && EXEMPLUM_TEST_BROWSER=1 cargo test --locked --workspace --all-features --test runtime']

[tasks.sweep]
description = "Remove target/ artifacts unused for 7 days; skipped if cargo-sweep is missing or SKIP_SWEEP is set"
condition = { env_not_set = ["SKIP_SWEEP"] }
script_runner = "@shell"
script = ['if cargo sweep --version >/dev/null 2>&1; then cargo sweep --time 7; else echo "cargo-sweep not installed; skipping sweep"; fi']

[tasks.ci]
dependencies = ["fmt", "clippy", "test", "sweep"]

[tasks.ci-fmt-fix]
dependencies = ["fmt-fix", "clippy", "test", "sweep"]

[tasks.db-up]
script_runner = "@shell"
script = ['set --; if [ -n "${EXEMPLUM_ENV_FILE+x}" ]; then [ -z "$EXEMPLUM_ENV_FILE" ] || set -- --env-file "$EXEMPLUM_ENV_FILE"; elif [ -f env/local.env ]; then set -- --env-file env/local.env; fi; docker compose "$@" up --detach --wait']

[tasks.db-down]
script_runner = "@shell"
script = ['set --; if [ -n "${EXEMPLUM_ENV_FILE+x}" ]; then [ -z "$EXEMPLUM_ENV_FILE" ] || set -- --env-file "$EXEMPLUM_ENV_FILE"; elif [ -f env/local.env ]; then set -- --env-file env/local.env; fi; docker compose "$@" down']

[tasks.db-status]
script_runner = "@shell"
script = ['set --; if [ -n "${EXEMPLUM_ENV_FILE+x}" ]; then [ -z "$EXEMPLUM_ENV_FILE" ] || set -- --env-file "$EXEMPLUM_ENV_FILE"; elif [ -f env/local.env ]; then set -- --env-file env/local.env; fi; docker compose "$@" ps']

[tasks.db-provision]
script_runner = "@shell"
script = ['set --; if [ -n "${EXEMPLUM_ENV_FILE+x}" ]; then [ -z "$EXEMPLUM_ENV_FILE" ] || set -- --env-file "$EXEMPLUM_ENV_FILE"; elif [ -f env/local.env ]; then set -- --env-file env/local.env; fi; docker compose "$@" exec -T postgres psql -X -U admin -d exemplum -f /provision/provision.sql']

[tasks.db-migrate]
command = "cargo"
args = ["run", "--locked", "-p", "exemplum-db-cli", "--bin", "exemplum-db", "--", "migrate"]

[tasks.db-verify]
command = "cargo"
args = ["run", "--locked", "-p", "exemplum-db-cli", "--bin", "exemplum-db", "--", "verify"]

[tasks.app]
description = "Run the public HTTP application against provisioned PostgreSQL"
command = "cargo"
args = ["run", "--locked", "-p", "exemplum-app-cli", "--bin", "app"]
