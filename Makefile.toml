[config]
default_to_workspace = false

# Incremental data and debug info do not help a full CI build. strip = "none"
# keeps proc-macro dylibs loadable on macOS once debug info is off.
[env]
CARGO_INCREMENTAL = { value = "0", condition = { env_true = ["CARGO_MAKE_CI"] } }
CARGO_PROFILE_DEV_DEBUG = { value = "0", condition = { env_true = ["CARGO_MAKE_CI"] } }
CARGO_PROFILE_DEV_STRIP = { value = "none", condition = { env_true = ["CARGO_MAKE_CI"] } }

[tasks.exec]
description = "Run a repository maintenance command"
script_runner = "@shell"
script = ['exec "$@"']

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt-fix]
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.build]
command = "cargo"
args = ["build", "--locked", "--workspace", "--all-features"]

[tasks.test]
description = "All tests; Docker must be running for self-contained integration suites"
command = "cargo"
args = ["test", "--locked", "--workspace", "--all-features"]

[tasks.test-rename]
description = "Test project customization in disposable Git repositories"
command = "python3"
args = ["-m", "unittest", "discover", "-s", "scripts/tests", "-v"]

[tasks.example-ci]
description = "Run CI across the Exemplum reference project"
command = "cargo"
args = ["make", "--cwd", "example", "ci"]
# The example shares this target dir, so the root sweep covers it.
env = { SKIP_SWEEP = "1" }

[tasks.sweep]
description = "Remove target/ artifacts unused for 7 days; skipped if cargo-sweep is missing"
script_runner = "@shell"
script = ['if cargo sweep --version >/dev/null 2>&1; then cargo sweep --time 7; else echo "cargo-sweep not installed; skipping sweep"; fi']

[tasks.ci]
dependencies = ["fmt", "clippy", "test", "test-rename", "example-ci", "sweep"]

[tasks.ci-fmt-fix]
dependencies = ["fmt-fix", "clippy", "test", "test-rename", "example-ci", "sweep"]

[tasks.apalis-dashboard]
command = "cargo"
args = ["run", "--locked", "-p", "apalis-dashboard"]
