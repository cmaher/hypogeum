[config]
default_to_workspace = false

[tasks.exec]
description = "Run a repository maintenance command"
script_runner = "@shell"
script = ['exec "$@"']

[tasks.test-db]
description = "Run self-contained PostgreSQL integration suites with Testcontainers and SQLx"
command = "cargo"
args = ["test", "--locked", "-p", "users", "-p", "tasks", "-p", "hypogeum-db", "--test", "integration"]

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt-fix]
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.build]
command = "cargo"
args = ["build", "--locked", "--workspace", "--all-features"]

[tasks.test]
description = "All tests; Docker must be running for self-contained integration suites"
command = "cargo"
args = ["test", "--locked", "--workspace", "--all-features"]

[tasks.test-rename]
description = "Test project customization in disposable Git repositories"
command = "python3"
args = ["-m", "unittest", "discover", "-s", "scripts/tests", "-v"]

[tasks.ci]
dependencies = ["fmt", "clippy", "build", "test", "test-rename"]

[tasks.ci-fmt-fix]
dependencies = ["fmt-fix", "clippy", "build", "test", "test-rename"]

[tasks.db-up]
script_runner = "@shell"
script = ['set --; if [ -n "${HYPOGEUM_ENV_FILE+x}" ]; then [ -z "$HYPOGEUM_ENV_FILE" ] || set -- --env-file "$HYPOGEUM_ENV_FILE"; elif [ -f env/local.env ]; then set -- --env-file env/local.env; fi; docker compose "$@" up --detach --wait']

[tasks.db-down]
script_runner = "@shell"
script = ['set --; if [ -n "${HYPOGEUM_ENV_FILE+x}" ]; then [ -z "$HYPOGEUM_ENV_FILE" ] || set -- --env-file "$HYPOGEUM_ENV_FILE"; elif [ -f env/local.env ]; then set -- --env-file env/local.env; fi; docker compose "$@" down']

[tasks.db-status]
script_runner = "@shell"
script = ['set --; if [ -n "${HYPOGEUM_ENV_FILE+x}" ]; then [ -z "$HYPOGEUM_ENV_FILE" ] || set -- --env-file "$HYPOGEUM_ENV_FILE"; elif [ -f env/local.env ]; then set -- --env-file env/local.env; fi; docker compose "$@" ps']

[tasks.db-provision]
script_runner = "@shell"
script = ['set --; if [ -n "${HYPOGEUM_ENV_FILE+x}" ]; then [ -z "$HYPOGEUM_ENV_FILE" ] || set -- --env-file "$HYPOGEUM_ENV_FILE"; elif [ -f env/local.env ]; then set -- --env-file env/local.env; fi; docker compose "$@" exec -T postgres psql -X -U admin -d hypogeum -f /provision/provision.sql']

[tasks.db-migrate]
command = "cargo"
args = ["run", "--locked", "-p", "hypogeum-db", "--", "migrate"]

[tasks.db-verify]
command = "cargo"
args = ["run", "--locked", "-p", "hypogeum-db", "--", "verify"]

[tasks.users]
command = "cargo"
args = ["run", "--locked", "-p", "users"]

[tasks.tasks-board]
command = "cargo"
args = ["run", "--locked", "-p", "tasks"]

[tasks.web-server]
description = "Run public HTTP, native gRPC and gRPC-Web without a database"
command = "cargo"
args = ["run", "--locked", "-p", "web-server"]
