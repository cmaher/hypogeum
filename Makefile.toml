[config]
default_to_workspace = false

[tasks.exec]
description = "Run a repository maintenance command"
script_runner = "@shell"
script = ['exec "$@"']

[tasks.test-db]
description = "Run self-contained PostgreSQL integration suites with Testcontainers and SQLx"
command = "cargo"
args = ["test", "--locked", "-p", "users", "-p", "tasks", "-p", "foundation-db", "--test", "integration"]

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt-fix]
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.build]
command = "cargo"
args = ["build", "--locked", "--workspace", "--all-features"]

[tasks.test]
description = "All tests; Docker must be running for self-contained integration suites"
command = "cargo"
args = ["test", "--locked", "--workspace", "--all-features"]

[tasks.ci]
dependencies = ["fmt", "clippy", "build", "test"]

[tasks.ci-fmt-fix]
dependencies = ["fmt-fix", "clippy", "build", "test"]

[tasks.db-up]
script_runner = "@shell"
script = ['docker compose --env-file "${FOUNDATION_LOCAL_CONFIG:-env/local.secrets}" up --detach --wait']

[tasks.db-down]
script_runner = "@shell"
script = ['docker compose --env-file "${FOUNDATION_LOCAL_CONFIG:-env/local.secrets}" down']

[tasks.db-status]
script_runner = "@shell"
script = ['docker compose --env-file "${FOUNDATION_LOCAL_CONFIG:-env/local.secrets}" ps']

[tasks.db-provision]
script_runner = "@shell"
script = ['docker compose --env-file "${FOUNDATION_LOCAL_CONFIG:-env/local.secrets}" exec -T postgres psql -X -U admin -d foundation -f /provision/provision.sql']

[tasks.db-migrate]
command = "cargo"
args = ["run", "--locked", "-p", "foundation-db", "--", "migrate"]

[tasks.db-verify]
command = "cargo"
args = ["run", "--locked", "-p", "foundation-db", "--", "verify"]

[tasks.users]
command = "cargo"
args = ["run", "--locked", "-p", "users"]

[tasks.tasks-board]
command = "cargo"
args = ["run", "--locked", "-p", "tasks"]
