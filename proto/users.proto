syntax = "proto3";
package hypogeum.users.v1;
import "google/protobuf/timestamp.proto";

message User {
  string id = 1;
  string display_name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}
message CreateUserRequest { string display_name = 1; }
message GetUserRequest { string id = 1; }
message ListUsersRequest {
  // Empty starts at the beginning. UUID ordering; exclusive cursor.
  string after_id = 1;
  // Zero selects the default (50), maximum 100.
  uint32 page_size = 2;
}
message ListUsersResponse {
  repeated User users = 1;
  // Empty means there is no next page.
  string next_after_id = 2;
}
message UpdateUserRequest { string id = 1; string display_name = 2; }
message DeleteUserRequest { string id = 1; }
message DeleteUserResponse {}

service Users {
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}
