name: Release tag

# On every merge to main: bump the workspace patch version, commit it, and
# push a matching vX.Y.Z tag so consumers can pin via `git = ..., tag = ...`.
# A version bumped by hand in the merged change (e.g. a breaking minor release)
# that has no tag yet is tagged as is, without a patch bump.
#
# No bump loop: pushes made with GITHUB_TOKEN never trigger workflows, and the
# actor guard below is a second safety net.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  bump-and-tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust
        # Keep in sync with mise.toml.
        run: rustup default 1.94.0

      - name: Compute next version
        id: version
        run: |
          current=$(cargo metadata --no-deps --format-version 1 --manifest-path Cargo.toml \
            | jq -r '.packages[] | select(.name == "hypgm-errors") | .version')
          if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            IFS=. read -r major minor patch <<< "$current"
            next="$major.$minor.$((patch + 1))"
          else
            next="$current"
          fi
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "Tag v$next already exists" >&2
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump workspace version
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          sed -i "s/^version = \"$CURRENT\"$/version = \"$NEXT\"/" Cargo.toml
          grep -q "^version = \"$NEXT\"$" Cargo.toml
          # Refresh path-dependency versions in both lockfiles without
          # upgrading anything else (CI builds with --locked).
          cargo metadata --format-version 1 --manifest-path Cargo.toml >/dev/null
          cargo metadata --format-version 1 --manifest-path example/Cargo.toml >/dev/null

      - name: Commit, tag, and push
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A hand-bumped version may leave nothing to commit.
          git diff --quiet || git commit -am "Release v$NEXT"
          git tag -a "v$NEXT" -m "Hypogeum $NEXT"
          git push --atomic origin HEAD:main "v$NEXT"
